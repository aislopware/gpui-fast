[build]
# v0 mangling scheme provides more detailed backtraces around closures
rustflags = ["-C", "symbol-mangling-version=v0"]

# The Apple-only floor (FORK.md). IPHONEOS_DEPLOYMENT_TARGET is not set here: with both set, a clang
# run that names no target builds for iOS, and the Mac kills what it built (aws-lc-sys refuses to build).
# iOS builds set it themselves.
[env]
MACOSX_DEPLOYMENT_TARGET = "27.2"
