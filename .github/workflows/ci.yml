name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# The fork builds for macOS and iOS 27.2 on Apple silicon only (FORK.md, "Apple only"),
# so every job runs on a Mac with Xcode 27: a binary built for 27.2 does not load on an
# older system.
jobs:
  test:
    name: Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain; this installs it.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # With the profiler, as an app running GPUI's hang monitor builds it: the
      # journal's and the hang detector's tests only compile with it. Clippy
      # below still builds gpui without it.
      - name: Test gpui
        run: cargo test -p gpui --features test-support,profiler

      # Scroll layer tiles must match drawing directly, byte for byte; these
      # run on the runner's GPU.
      - name: Test scroll layers on Metal
        run: cargo test -p gpui_apple fast::layers -- --nocapture

      # gpui_macos's own: the immediate frame's slot, the frame park, the
      # cursor and text smoothing.
      - name: Test gpui_macos
        run: cargo test -p gpui_macos

      # gpui_ios's pure parts (hardware keys, described input, frame pacing, the
      # keyboard inset) are compiled on the host too, so their tests run here.
      - name: Test gpui_ios on the host
        run: cargo test -p gpui_ios

      - name: Check gpui_ios for iOS
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo check -p gpui_platform --target aarch64-apple-ios
          cargo check -p gpui_platform --target aarch64-apple-ios-sim

      - name: Check gpui_perf
        run: cargo check -p gpui_perf --all-targets

      # The gpui-pre and gpui-fast stand-ins GPUI Kit applications patch in
      # (compat/): every feature a crate they stand in for has must reach ours.
      - name: Check compat
        run: >-
          cargo check -p gpui-pre -p gpui-pre-platform -p gpui-pre-macros
          -p gpui-pre-reqwest-client -p gpui-pre-sum-tree
          -p gpui-fast -p gpui-fast-platform --all-features

  lint:
    name: Lint and upstream check
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          # script/check-upstream compares with the upstream import commit.
          fetch-depth: 0

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check that upstream files only hold hooks
        run: script/check-upstream

      - name: Rustfmt
        run: cargo fmt -p gpui -p gpui_perf -p gpui_apple -p gpui_macos -p gpui_ios -- --check

      - name: Clippy
        run: cargo clippy -p gpui -p gpui_perf --all-targets --features gpui/test-support -- -D warnings

      - name: Clippy with the profiler
        run: cargo clippy -p gpui --all-targets --features test-support,profiler -- -D warnings
