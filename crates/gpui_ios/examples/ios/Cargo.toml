[package]
name = "gpui_ios_example"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_ios_example.rs"
crate-type = ["staticlib"]

[features]
# The main menu checks (`src/menu_test.rs`), which deliver key presses through
# `gpui_ios::inject`.
menu-test = ["gpui_ios/test-support"]

[target.'cfg(target_os = "ios")'.dependencies]
gpui.workspace = true
gpui_ios.workspace = true
log.workspace = true
objc2.workspace = true
