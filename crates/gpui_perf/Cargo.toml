[package]
name = "gpui_perf"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Simulated application scenarios — forms, lists, tables — for measuring GPUI frame cost automatically"

[lints]
workspace = true

[lib]
path = "src/gpui_perf.rs"
doctest = false

[[bin]]
name = "gpui_perf"
path = "src/main.rs"

[[example]]
name = "content_mask"
required-features = ["fast"]

[[example]]
name = "views_frames"
required-features = ["fast"]

[[example]]
name = "wrap_cost"
required-features = ["fast"]

[[example]]
name = "composition_latency"
required-features = ["fast"]

[[example]]
name = "windowserver_gpu"
required-features = ["fast"]

[[example]]
name = "video_latency"
required-features = ["fast"]

[[example]]
name = "idle_presents"
required-features = ["fast"]

[[test]]
name = "composition_macos"
harness = false
required-features = ["fast"]

[[test]]
name = "gpui_tokio"
required-features = ["fast"]

[features]
default = ["fast"]
# Build against this repository's GPUI: the showcase, `--headless` and the
# examples, with gpui-fast's counters.
fast = ["dep:gpui_fast", "dep:gpui_platform_fast"]
# Build the showcase against upstream GPUI instead, the `gpui-pre` snapshot
# GPUI Kit pins, to compare the two on the same screens:
# `cargo run -p gpui_perf --release --features upstream`, or with
# `--no-default-features` too, to skip building this repository's GPUI.
upstream = ["dep:gpui_pre", "dep:gpui_pre_platform"]

[dependencies]
# Named `gpui_fast` and `gpui_platform_fast` so that either GPUI can be named
# `gpui` by the crate roots; see `src/main.rs`.
gpui_fast = { package = "gpui", path = "../gpui", default-features = false, features = ["test-support"], optional = true }
gpui_platform_fast = { package = "gpui_platform", path = "../gpui_platform", default-features = false, features = ["font-kit"], optional = true }
gpui_pre = { package = "gpui-pre", version = "=0.3.7", optional = true }
gpui_pre_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit"], optional = true }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
smol.workspace = true

[dev-dependencies]
futures.workspace = true
gpui_tokio.workspace = true
raw-window-handle.workspace = true
roxmltree = "0.21"

[target.'cfg(target_os = "macos")'.dev-dependencies]
cocoa.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "CFDictionary"] }
objc2-core-video = { workspace = true, features = ["CVPixelBuffer", "CVReturn"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "objc2-core-foundation",
] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }
objc.workspace = true
objc2.workspace = true
block2.workspace = true
gpui_apple.workspace = true
gpui_macos.workspace = true
parking_lot.workspace = true
